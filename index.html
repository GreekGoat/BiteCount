<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BiteCount" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Log what you eat in plain words. BiteCount works out the calories." />
    <meta name="theme-color" content="#07070c" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>BiteCount</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      ;(function () {
        var theme = 'system'
        try {
          var saved = JSON.parse(localStorage.getItem('bitecount') || '{}')
          theme = (saved.state && saved.state.settings && saved.state.settings.theme) || 'system'
        } catch (e) {}
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f3f8' : '#07070c'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
